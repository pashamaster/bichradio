<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="bichradio" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>bichradio</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: rgba(255,255,255,0.07);
      --text: #e8e2d9;
      --muted: rgba(232,226,217,0.35);
      --accent: #c8a96e;
      --red: #e05252;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Geist Mono', monospace;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.028;
      pointer-events: none;
      z-index: 1000;
    }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 28px 0;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.1rem;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 8px var(--red);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--red); }
      50% { opacity: 0.4; box-shadow: 0 0 2px var(--red); }
    }

    .center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 28px;
      gap: 40px;
    }

    .visualizer {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 48px;
      opacity: 0.5;
    }

    .bar {
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
      animation: bounce var(--d) ease-in-out infinite alternate;
      transform-origin: bottom;
    }

    @keyframes bounce {
      from { transform: scaleY(0.1); }
      to { transform: scaleY(1); }
    }

    .visualizer.paused .bar { animation-play-state: paused; transform: scaleY(0.1); }

    .track-info {
      text-align: center;
      max-width: 320px;
      width: 100%;
    }

    .track-label {
      font-size: 0.55rem;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .track-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.2rem, 5vw, 1.7rem);
      line-height: 1.35;
      color: var(--text);
      min-height: 2.7em;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease;
    }

    .track-title.fading { opacity: 0; }

    .playlist-btns {
      display: flex;
      gap: 12px;
    }

    .pl-btn {
      font-family: 'Geist Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 22px;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .pl-btn:hover { border-color: var(--accent); color: var(--accent); }

    .pl-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(200,169,110,0.07);
    }

    .pl-btn:disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

    .controls {
      padding: 0 28px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .main-controls {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    .btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      transition: color 0.2s, transform 0.15s;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover { color: var(--text); transform: scale(1.1); }
    .btn:active { transform: scale(0.95); }

    .btn-play {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1px solid var(--border) !important;
      background: var(--surface) !important;
      color: var(--text);
      transition: all 0.2s;
    }

    .btn-play:hover {
      border-color: var(--accent) !important;
      color: var(--accent);
      transform: scale(1.05);
    }

    #sc-widget-sexy, #sc-widget-class, #mc-widget {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      bottom: 0; left: 0;
    }

    .loading-msg {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-align: center;
    }

    .counter-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 4px;
    }

    .counter-label {
      font-size: 0.55rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(232,226,217,0.2);
    }

    .counter-value {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: rgba(232,226,217,0.35);
    }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .app { animation: fadein 0.8s ease both; }

    /* ── PWA install banner ── */
    .pwa-banner {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 999;
      padding: 14px 20px 20px;
      background: #161410;
      border-top: 1px solid rgba(200,169,110,0.2);
      animation: slideup 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .pwa-banner.visible { display: flex; align-items: center; gap: 14px; }

    @keyframes slideup {
      from { transform: translateY(100%); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .pwa-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      background: #0a0a0a;
      border: 1px solid rgba(200,169,110,0.3);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 0.7rem;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .pwa-text { flex: 1; }

    .pwa-text strong {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--text);
      margin-bottom: 3px;
    }

    .pwa-text span {
      font-size: 0.6rem;
      letter-spacing: 0.06em;
      color: var(--muted);
      line-height: 1.4;
    }

    .pwa-share-icon {
      display: inline-block;
      width: 12px; height: 14px;
      vertical-align: middle;
      margin: 0 2px;
      position: relative; top: -1px;
    }

    .pwa-dismiss {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px 6px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.2s;
    }

    .pwa-dismiss:hover { color: var(--text); }

    .pwa-banner.android .ios-hint  { display: none; }
    .pwa-banner.ios     .and-hint  { display: none; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">bichradio</div>
    <div class="live-badge">
      <div class="live-dot"></div>
      <span>on air</span>
    </div>
  </header>

  <div class="center">
    <div class="visualizer paused" id="visualizer"></div>

    <div class="track-info">
      <div class="track-label">now playing</div>
      <div class="track-title" id="track-title">—</div>
    </div>

    <div class="playlist-btns">
      <button class="pl-btn" id="btn-class">class</button>
      <button class="pl-btn active" id="btn-sexy">sexy</button>
    </div>
  </div>

  <div class="controls">
    <div class="main-controls">
      <button class="btn" id="btn-prev" title="Previous">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="btn btn-play" id="btn-play" title="Play/Pause">
        <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="btn" id="btn-next" title="Next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm2-8.14 5.25 3.64L8 16.14V9.86zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
    <div class="loading-msg" id="status-msg">tap play to start</div>
    <div class="counter-wrap">
      <span class="counter-label">tuned in</span>
      <span class="counter-value" id="counter-value">—</span>
      <span class="counter-label">times</span>
    </div>
  </div>
</div>

<!-- PWA install banner -->
<div class="pwa-banner" id="pwa-banner" role="banner" aria-label="Install bichradio">
  <div class="pwa-icon">br</div>
  <div class="pwa-text">
    <strong>Install bichradio</strong>
    <span class="ios-hint">
      Tap
      <svg class="pwa-share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)">
        <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/>
      </svg>
      then <em style="color:var(--accent);font-style:normal">Add to Home Screen</em>
    </span>
    <span class="and-hint">
      Tap <em style="color:var(--accent);font-style:normal">⋮ Menu → Add to Home Screen</em>
    </span>
  </div>
  <button class="pwa-dismiss" id="pwa-dismiss" aria-label="Dismiss">✕</button>
</div>

<!-- Only the 'sexy' iframe loads at start. 'class' + Mixcloud inject on demand. -->
<iframe id="sc-widget-sexy"
  src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/pavel-masterov/sets/sexy&auto_play=false&show_artwork=false&show_user=false&show_reposts=false&show_teaser=false&visual=false"
  allow="autoplay">
</iframe>

<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
  // ── Version check — auto-reload if stale ─────────────────
  const PAGE_VERSION = '1772090907';
  (async function checkVersion() {
    try {
      const res  = await fetch('/version.json?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      if (data.version && data.version !== PAGE_VERSION) {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        location.reload(true);
      }
    } catch(e) {}
  })();

  // ── Visualizer bars (14 — lighter compositing than 22) ────
  const viz = document.getElementById('visualizer');
  for (let i = 0; i < 14; i++) {
    const b = document.createElement('div');
    b.className = 'bar';
    b.style.setProperty('--d', (0.6 + Math.random() * 0.8).toFixed(2) + 's');
    b.style.height = (10 + Math.random() * 34).toFixed(0) + 'px';
    viz.appendChild(b);
  }

  // ── Blocked-region detection + Mixcloud fallback ─────────
  const BLOCKED_COUNTRIES = ['RU', 'BY', 'KP', 'IR', 'CU', 'SY'];
  let   mcMode       = false;
  let   mcWidget     = null;
  let   mcPlaying    = false;
  let   scReadyTimer = null;

  async function checkGeo() {
    try {
      const res = await Promise.race([
        fetch('https://ipapi.co/json/', { cache: 'no-store' }),
        new Promise((_, rej) => setTimeout(() => rej(), 4000))
      ]);
      if (!res.ok) return;
      const data = await res.json();
      if (BLOCKED_COUNTRIES.includes(data.country_code)) activateMixcloud();
    } catch(e) {}
  }

  function onScReadyTimeout() {
    if (!mcMode) activateMixcloud();
  }

  function activateMixcloud() {
    if (mcMode) return;
    mcMode = true;

    try { channels.sexy.widget?.pause(); } catch(e) {}
    try { channels.class?.widget?.pause(); } catch(e) {}

    // Inject the Mixcloud iframe only now (not preloaded — saves memory)
    const mcIframe = document.createElement('iframe');
    mcIframe.id = 'mc-widget';
    mcIframe.src = 'https://www.mixcloud.com/widget/iframe/?hide_cover=1&mini=1&autoplay=0&feed=%2Fpashakaef%2Fplaylists%2Fclass%2F';
    mcIframe.allow = 'autoplay';
    document.body.appendChild(mcIframe);

    const script  = document.createElement('script');
    script.src    = 'https://widget.mixcloud.com/media/js/widgetApi.js';
    script.onload = () => {
      mcWidget = window.Mixcloud.PlayerWidget(mcIframe);
      mcWidget.ready.then(() => {
        mcWidget.events.play.on(() => {
          mcPlaying = true;
          viz.classList.remove('paused');
          setPlayIcon(true);
          setTitle('class · mixcloud');
          setStatus('');
          updateMediaSession('class · mixcloud');
        });
        mcWidget.events.pause.on(() => {
          mcPlaying = false;
          viz.classList.add('paused');
          setPlayIcon(false);
          pauseMediaSession();
        });
        mcWidget.events.ended.on(() => {
          mcPlaying = false;
          viz.classList.add('paused');
          setPlayIcon(false);
        });
      });
    };
    document.body.appendChild(script);

    document.querySelectorAll('.pl-btn').forEach(btn => {
      btn.disabled = true;
      btn.title    = 'channel switching unavailable in your region';
    });
    document.getElementById('btn-class')?.classList.add('active');
    document.getElementById('btn-sexy')?.classList.remove('active');

    setStatus('SoundCloud unavailable — playing via Mixcloud');
    setTimeout(() => setStatus(''), 4000);

    isPlaying = false;
    viz.classList.add('paused');
    setPlayIcon(false);
    setTitle('class');
  }

  checkGeo();

  // ── Channels — sexy loads now, class lazy-loads on switch ─
  const channels = {
    sexy:  { id: 'sexy',  iframe: document.getElementById('sc-widget-sexy'), widget: null, tracks: [], shuffled: [], ready: false },
    class: { id: 'class', iframe: null, widget: null, tracks: [], shuffled: [], ready: false }
  };
  channels.sexy.widget = SC.Widget(channels.sexy.iframe);

  // ── State ────────────────────────────────────────────────
  let activeId   = 'sexy';
  let isPlaying  = false;
  let currentIdx = 0;
  const userVolume = 80; // fixed — volume handled by device, no in-app slider
  let switching  = false;
  let playRetry  = null;
  const SEEK_MIN      = 9 * 60 * 1000;
  const SEEK_MAX      = 35 * 60 * 1000;
  const SEEK_FALLBACK = 25 * 60 * 1000;
  const FADE_MS    = 300;
  const FADE_STEPS = 3;

  let seekDone      = false;
  let seekTried     = false;
  let seekFromStart = false;

  // ── Helpers ──────────────────────────────────────────────
  function active() { return channels[activeId]; }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function setTitle(title) {
    const el = document.getElementById('track-title');
    el.classList.add('fading');
    setTimeout(() => { el.textContent = title || '—'; el.classList.remove('fading'); }, 400);
  }

  function setStatus(msg) { document.getElementById('status-msg').textContent = msg; }

  function setPlayIcon(playing) {
    document.getElementById('icon-play').style.display  = playing ? 'none' : '';
    document.getElementById('icon-pause').style.display = playing ? '' : 'none';
  }

  function fadeWidget(w, fromVol, toVol, ms, onDone) {
    let step = 0;
    const interval = ms / FADE_STEPS;
    const timer = setInterval(() => {
      step++;
      const t    = step / FADE_STEPS;
      const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
      const vol  = Math.round(fromVol + (toVol - fromVol) * ease);
      w.setVolume(Math.max(0, Math.min(100, vol)));
      if (step >= FADE_STEPS) { clearInterval(timer); if (onDone) onDone(); }
    }, interval);
    return timer;
  }

  // ── Seek — only for user-triggered skips ─────────────────
  function doSeek(w) {
    if (seekDone || seekFromStart) return;
    seekDone = true;
    w.getCurrentSound(s => {
      if (!s) return doRandomSeek(w);
      const title = (s.title || '').toLowerCase();
      if (title.includes('david melo') || title.includes('pasha m')) {
        w.seekTo(7 * 60 * 1000);
      } else {
        doRandomSeek(w);
      }
    });
  }

  function doRandomSeek(w) {
    seekTried = true;
    const seekTo = SEEK_MIN + Math.floor(Math.random() * (SEEK_MAX - SEEK_MIN));
    w.seekTo(seekTo);
  }

  // ── Reliable play with retry ─────────────────────────────
  function reliablePlay(w, onConfirmed) {
    clearInterval(playRetry);
    let attempts = 0;
    const attempt = () => {
      if (isPlaying) { clearInterval(playRetry); playRetry = null; if (onConfirmed) onConfirmed(); return; }
      if (attempts >= 6) { clearInterval(playRetry); playRetry = null; setStatus('tap play to retry'); return; }
      attempts++;
      w.play();
    };
    attempt();
    playRetry = setInterval(attempt, 800);
  }

  // ── Play a track ─────────────────────────────────────────
  function playTrack(idx, fromStart = false) {
    seekDone      = false;
    seekTried     = false;
    seekFromStart = fromStart;
    clearInterval(playRetry);
    const ch = active();
    ch.widget.skip(ch.shuffled[idx]);
    ch.widget.setVolume(userVolume);
    if (fromStart) {
      setTimeout(() => {
        ch.widget.seekTo(0);
        ch.widget.play();
      }, 300);
    } else {
      reliablePlay(ch.widget);
    }
  }

  // ── Lazy-load the class channel iframe on first switch ────
  function ensureClassLoaded() {
    if (channels.class.iframe) return;
    const f = document.createElement('iframe');
    f.id = 'sc-widget-class';
    f.src = 'https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/pavel-masterov/sets/class&auto_play=false&show_artwork=false&show_user=false&show_reposts=false&show_teaser=false&visual=false';
    f.allow = 'autoplay';
    document.body.appendChild(f);
    channels.class.iframe = f;
    channels.class.widget = SC.Widget(f);
    bindChannel(channels.class);
  }

  // ── Bind events for one channel widget ───────────────────
  function bindChannel(ch) {
    if (ch.id === 'class') {
      scReadyTimer = setTimeout(() => {
        if (!ch.ready) onScReadyTimeout();
      }, 5000);
    }

    ch.widget.bind(SC.Widget.Events.READY, () => {
      if (ch.id === 'class' && scReadyTimer) {
        clearTimeout(scReadyTimer);
        scReadyTimer = null;
      }
      ch.widget.getSounds(sounds => {
        if (!sounds.length) return;
        ch.tracks   = sounds;
        ch.shuffled = shuffle(sounds.map((_, i) => i));
        ch.ready    = true;
        if (ch.id !== activeId) ch.widget.setVolume(0);
      });
    });

    ch.widget.bind(SC.Widget.Events.PLAY, () => {
      if (ch.id !== activeId) {
        ch.widget.setVolume(0);
        ch.widget.pause();
        return;
      }
      if (!isPlaying) {
        isPlaying = true;
        viz.classList.remove('paused');
        setPlayIcon(true);
        acquireWakeLock();
        ch.widget.getCurrentSound(s => {
          if (s) {
            setTitle(s.title);
            updateMediaSession(s.title);
          }
        });
        setStatus('');
        setTimeout(() => doSeek(ch.widget), 400);
      }
      if (switching) {
        fadeWidget(ch.widget, 0, userVolume, FADE_MS, () => {
          switching = false;
          document.querySelectorAll('.pl-btn').forEach(b => b.disabled = false);
        });
      }
    });

    ch.widget.bind(SC.Widget.Events.PAUSE, () => {
      if (ch.id !== activeId || switching) return;
      isPlaying = false;
      viz.classList.add('paused');
      setPlayIcon(false);
      pauseMediaSession();
      releaseWakeLock();
    });

    ch.widget.bind(SC.Widget.Events.FINISH, () => {
      if (ch.id !== activeId) return;
      isPlaying = false;
      if (seekTried) {
        seekTried = false;
        ch.widget.seekTo(SEEK_FALLBACK);
        ch.widget.play();
        return;
      }
      currentIdx = (currentIdx + 1) % ch.shuffled.length;
      playTrack(currentIdx, true);
    });

    ch.widget.bind(SC.Widget.Events.ERROR, () => {
      if (ch.id !== activeId) return;
      isPlaying = false;
      setStatus('stream error — skipping…');
      setTimeout(() => { currentIdx = (currentIdx + 1) % ch.shuffled.length; playTrack(currentIdx); }, 800);
    });
  }

  bindChannel(channels.sexy);

  // ── Channel switch ───────────────────────────────────────
  function switchChannel(toId) {
    if (switching || toId === activeId) return;
    if (toId === 'class') ensureClassLoaded(); // lazy-load on first use
    switching = true;
    clearInterval(playRetry);
    document.querySelectorAll('.pl-btn').forEach(b => b.disabled = true);

    const from = active();
    const to   = channels[toId];

    const startSwitch = () => {
      to.widget.setVolume(0);
      activeId   = toId;
      currentIdx = 0;
      seekDone   = false; seekTried = false;
      isPlaying  = false;

      fadeWidget(from.widget, userVolume, 0, FADE_MS, () => {
        from.widget.pause();
        from.widget.setVolume(0);
      });

      to.widget.skip(to.shuffled[currentIdx]);
      reliablePlay(to.widget);

      setTitle(to.tracks[to.shuffled[currentIdx]]?.title || '—');
      setStatus('');
      viz.classList.add('paused');
      setPlayIcon(false);

      setTimeout(() => {
        if (switching) {
          switching = false;
          document.querySelectorAll('.pl-btn').forEach(b => b.disabled = false);
          if (!isPlaying) to.widget.setVolume(userVolume);
        }
      }, 6000);
    };

    if (to.ready) {
      startSwitch();
    } else {
      setStatus('loading channel…');
      let waited = 0;
      const wait = setInterval(() => {
        waited += 250;
        if (to.ready) { clearInterval(wait); startSwitch(); }
        else if (waited > 8000) {
          clearInterval(wait);
          switching = false;
          document.querySelectorAll('.pl-btn').forEach(b => b.disabled = false);
          setStatus('channel not ready — try again');
        }
      }, 250);
    }
  }

  // ── Playlist buttons ─────────────────────────────────────
  document.querySelectorAll('.pl-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (mcMode) return;
      const toId = btn.id === 'btn-sexy' ? 'sexy' : 'class';
      if (toId === activeId || switching) return;
      document.querySelectorAll('.pl-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      switchChannel(toId);
    });
  });

  // ── Play / Pause ─────────────────────────────────────────
  document.getElementById('btn-play').addEventListener('click', () => {
    if (mcMode) {
      if (!mcWidget) { setStatus('loading Mixcloud…'); return; }
      if (mcPlaying) mcWidget.pause();
      else           mcWidget.play();
      return;
    }
    if (switching) return;
    const ch = active();
    if (isPlaying) {
      clearInterval(playRetry);
      ch.widget.pause();
    } else {
      if (!ch.ready) { setStatus('loading…'); return; }
      ch.widget.setVolume(userVolume);
      playTrack(currentIdx);
    }
  });

  document.getElementById('btn-next').addEventListener('click', () => {
    if (mcMode || switching) return;
    const ch = active();
    currentIdx = (currentIdx + 1) % ch.shuffled.length;
    playTrack(currentIdx);
  });

  document.getElementById('btn-prev').addEventListener('click', () => {
    if (mcMode || switching) return;
    const ch = active();
    currentIdx = (currentIdx - 1 + ch.shuffled.length) % ch.shuffled.length;
    playTrack(currentIdx);
  });

  // ── Visit counter ────────────────────────────────────────
  const COUNTER_URL = 'https://bichradiodb.p-masterov.workers.dev';

  function showCount(n) {
    document.getElementById('counter-value').textContent = Number(n).toLocaleString();
  }

  async function incrementCounter() {
    try {
      const res  = await fetch(`${COUNTER_URL}/increment`, { method: 'POST' });
      if (!res.ok) throw new Error(`Worker responded ${res.status}`);
      const data = await res.json();
      showCount(data.count);
    } catch(e) {
      try {
        const res  = await fetch(`${COUNTER_URL}/count`);
        const data = await res.json();
        if (data.count != null) showCount(data.count);
      } catch(e2) {}
    }
  }

  incrementCounter();

  // ── PWA install banner ───────────────────────────────────
  (function() {
    const banner  = document.getElementById('pwa-banner');
    const dismiss = document.getElementById('pwa-dismiss');
    const STORAGE_KEY = 'bichradio-pwa-dismissed';

    const isInstalled = window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
    const wasDismissed = sessionStorage.getItem(STORAGE_KEY);
    if (isInstalled || wasDismissed) return;

    const ua = navigator.userAgent;
    const isIOS     = /iphone|ipad|ipod/i.test(ua) && !/crios/i.test(ua);
    const isAndroid = /android/i.test(ua);
    const isMobile  = isIOS || isAndroid;
    const isSafari  = isIOS && /safari/i.test(ua) && !/fxios/i.test(ua);

    if (!isMobile) return;
    if (isIOS && !isSafari) return;

    banner.classList.add('visible');
    banner.classList.add(isIOS ? 'ios' : 'android');

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
    });

    banner.addEventListener('click', async e => {
      if (e.target === dismiss) return;
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') hideBanner();
        deferredPrompt = null;
      }
    });

    dismiss.addEventListener('click', hideBanner);
    setTimeout(hideBanner, 12000);

    function hideBanner() {
      sessionStorage.setItem(STORAGE_KEY, '1');
      banner.style.transition = 'opacity 0.4s, transform 0.4s';
      banner.style.opacity    = '0';
      banner.style.transform  = 'translateY(100%)';
      setTimeout(() => banner.remove(), 400);
    }
  })();

  // ── Media Session (lock screen / CarPlay) ────────────────
  // Two silent MP3s claim the media session so CarPlay/lock screen
  // shows "bichradio" + track title instead of "SoundCloud Widget".
  const silentAudio = (function() {
    if (!('mediaSession' in navigator)) return null;

    const make = (src) => {
      const el = document.createElement('audio');
      el.src    = src;
      el.loop   = true;
      el.volume = 0.001;
      el.setAttribute('playsinline', '');
      el.setAttribute('webkit-playsinline', '');
      document.body.appendChild(el);
      return el;
    };

    const elIdle   = make('/silent-bichradio.mp3');
    const elActive = make('/silent.mp3');

    const ch = () => channels[activeId];

    navigator.mediaSession.setActionHandler('play', () => {
      if (mcMode) { mcWidget?.play(); return; }
      ch().widget.setVolume(userVolume);
      reliablePlay(ch().widget);
    });
    navigator.mediaSession.setActionHandler('pause', () => {
      if (mcMode) { mcWidget?.pause(); return; }
      ch().widget.pause();
    });
    navigator.mediaSession.setActionHandler('nexttrack', () => {
      if (mcMode) return;
      currentIdx = (currentIdx + 1) % ch().shuffled.length;
      playTrack(currentIdx);
    });
    navigator.mediaSession.setActionHandler('previoustrack', () => {
      if (mcMode) return;
      currentIdx = (currentIdx - 1 + ch().shuffled.length) % ch().shuffled.length;
      playTrack(currentIdx);
    });

    document.addEventListener('click', function claimSession() {
      elIdle.play().catch(() => {});
      navigator.mediaSession.metadata = new MediaMetadata({
        title: 'bichradio', artist: 'bichradio', album: 'on air',
        artwork: [
          { src: '/icon-192.png', sizes: '192x192', type: 'image/png' },
          { src: '/icon-512.png', sizes: '512x512', type: 'image/png' }
        ]
      });
      document.removeEventListener('click', claimSession);
    }, { once: true });

    return { idle: elIdle, active: elActive };
  })();

  function updateMediaSession(title) {
    if (!('mediaSession' in navigator) || !silentAudio) return;
    silentAudio.idle.pause();
    silentAudio.active.play().catch(() => {});
    navigator.mediaSession.metadata = new MediaMetadata({
      title:  title || 'bichradio',
      artist: 'bichradio',
      album:  activeId === 'sexy' ? 'sexy' : 'class',
      artwork: [
        { src: '/icon-192.png', sizes: '192x192', type: 'image/png' },
        { src: '/icon-512.png', sizes: '512x512', type: 'image/png' }
      ]
    });
    navigator.mediaSession.playbackState = 'playing';
  }

  function pauseMediaSession() {
    if (!('mediaSession' in navigator) || !silentAudio) return;
    silentAudio.active.pause();
    silentAudio.idle.play().catch(() => {});
    navigator.mediaSession.metadata = new MediaMetadata({
      title: 'bichradio', artist: 'bichradio', album: 'on air',
      artwork: [
        { src: '/icon-192.png', sizes: '192x192', type: 'image/png' },
        { src: '/icon-512.png', sizes: '512x512', type: 'image/png' }
      ]
    });
    navigator.mediaSession.playbackState = 'paused';
  }

  // ── Wake Lock — prevent screen sleep during playback ─────
  // (No-op on CarPlay/iOS where it isn't supported — guarded.)
  let wakeLock = null;

  async function acquireWakeLock() {
    if (!('wakeLock' in navigator)) return;
    if (wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch(e) {}
  }

  async function releaseWakeLock() {
    if (wakeLock) { try { await wakeLock.release(); } catch(e) {} wakeLock = null; }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && isPlaying) acquireWakeLock();
  });

  // ── Service worker + Push notifications ──────────────────
  const VAPID_PUBLIC_KEY = 'BNoxPSlXS8Zors0VfNKZeW13VRKpHPE1zV1b9N7bJiw63dDVLA9QVccfi9oUAMyl7cbdo1mKtzv78iQPxRUK0Qk';

  function urlBase64ToUint8(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64  = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const raw     = atob(base64);
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  }

  async function subscribeToPush(swReg) {
    try {
      let sub = await swReg.pushManager.getSubscription();
      if (!sub) {
        sub = await swReg.pushManager.subscribe({
          userVisibleOnly:      true,
          applicationServerKey: urlBase64ToUint8(VAPID_PUBLIC_KEY)
        });
      }
      await fetch(`${COUNTER_URL}/push/subscribe`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(sub.toJSON())
      });
    } catch(e) {}
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(async reg => {
        const isMobilePWA = (
          window.matchMedia('(display-mode: standalone)').matches ||
          navigator.standalone
        ) && /iphone|ipad|ipod|android/i.test(navigator.userAgent);

        if (!isMobilePWA || !('PushManager' in window)) return;

        document.getElementById('btn-play').addEventListener('click', function askOnce() {
          document.getElementById('btn-play').removeEventListener('click', askOnce);
          setTimeout(async () => {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') await subscribeToPush(reg);
          }, 3000);
        }, { once: true });
      })
      .catch(() => {});
  }
</script>
